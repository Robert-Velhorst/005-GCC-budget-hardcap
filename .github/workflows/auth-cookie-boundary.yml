name: Authentication cookie boundary
on:
  pull_request:
    paths:
      - src/control/auth.js
      - .github/qualification/auth-cookie-cases.cjs
      - .github/scripts/auth_cookie_proof.py
      - .github/workflows/auth-cookie-boundary.yml
permissions:
  contents: read
jobs:
  cookie-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Compare identical original and patched authentication cases
        run: python -B -I .github/scripts/auth_cookie_proof.py
      - name: Retain complete source and case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auth-cookie-boundary-proof
          path: AUTH_COOKIE_EVIDENCE
          if-no-files-found: error
          retention-days: 14
