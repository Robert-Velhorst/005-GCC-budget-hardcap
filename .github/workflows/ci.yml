name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build:web
      - run: npm run smoke
      - run: npm audit --audit-level=moderate
      - run: docker build --tag gcc-budget-hardcap:ci .
      - run: docker build --file Dockerfile.function --tag gcc-budget-hardcap-function:ci .
