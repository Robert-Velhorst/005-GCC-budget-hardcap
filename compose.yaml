services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
      - .runtime/control.env
    environment:
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 8787
      LOCAL_DATABASE_PATH: /data/budget-hardcap.db
      PUBLIC_ACCESS_ENABLED: "true"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - control-data:/data
      - type: bind
        source: ${APPDATA}/gcloud
        target: /home/node/.config/gcloud
        read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  control-data:
